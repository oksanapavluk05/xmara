    <title>Бронювання успішне | Хмара</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Nunito Sans', sans-serif;
            background: linear-gradient(rgba(1,36,64,0.75), rgba(1,36,64,0.75)),
            url('img/new/booking_banner.webp') center/cover no-repeat;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .success-box{
            background:#ffffff;
            max-width:600px;
            width:100%;
            padding:50px 40px;
            border-radius:25px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,0.2);
        }

        .success-icon{
            width:90px;
            height:90px;
            background:#b1faff;
            color:#249ffd;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:42px;
            margin:0 auto 25px;
            font-weight:bold;
        }

        h1{
            font-family:'DM Serif Display', serif;
            font-size:42px;
            color:#012440;
            margin-bottom:20px;
        }

        p{
            font-size:18px;
            color:#555;
            line-height:1.7;
            margin-bottom:35px;
        }

        .btn-home{
            display:inline-block;
            padding:15px 35px;
            background:#012440;
            color:white;
            text-decoration:none;
            border-radius:12px;
            font-size:17px;
            font-weight:600;
            transition:0.3s;
        }

        .btn-home:hover{
            background:#024873;
            transform:translateY(-2px);
        }

        @media(max-width:768px){

            .success-box{
                padding:40px 25px;
            }

            h1{
                font-size:32px;
            }

            p{
                font-size:16px;
            }

        }
    </style>
